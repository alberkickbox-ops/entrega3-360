<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escena 1 · a-sky · Planeta lejano</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // Componente propio: la entidad cambia de color al pasar el cursor por encima
    AFRAME.registerComponent('brilla-al-mirar', {
      init: function () {
        var el = this.el, original = el.getAttribute('color');
        el.addEventListener('mouseenter', function () { el.setAttribute('color', '#ffd166'); });
        el.addEventListener('mouseleave', function () { el.setAttribute('color', original); });
      }
    });
  </script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true">
    <a-assets>
      <!-- Panorámica equirrectangular 4096x2048 (obra propia, ver RECURSOS.md) -->
      <img id="panorama" src="assets/planeta-lejano.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Fondo 360º basado en imagen fija -->
    <a-sky src="#panorama" rotation="0 -90 0"></a-sky>

    <!-- Título flotante -->
    <a-text value="PLANETA LEJANO" position="0 2.6 -4" align="center" width="9" color="#ffffff"></a-text>
    <a-text value="Mira alrededor y busca el planeta con anillos"
            position="0 2.1 -4" align="center" width="5" color="#b8c7ff"></a-text>

    <!-- Objetos flotantes con animación y reacción a la mirada -->
    <a-octahedron position="-2.5 1.4 -3.5" radius="0.45" color="#7ad7f0" brilla-al-mirar
                  animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear"></a-octahedron>
    <a-torus-knot position="2.5 1.4 -3.5" radius="0.3" radius-tubular="0.07" color="#ff8fab" brilla-al-mirar
                  animation="property: rotation; to: 360 360 0; dur: 12000; loop: true; easing: linear"></a-torus-knot>
    <a-sphere position="0 0.7 -3" radius="0.25" color="#c3f584" brilla-al-mirar
              animation="property: position; to: 0 1.1 -3; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine"></a-sphere>

    <!-- Cámara con cursor de mirada (fuse) para móvil y visores VR -->
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor="fuse: true; fuseTimeout: 1200"
                position="0 0 -1" geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
                material="color: white; shader: flat"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
